name: Windows and Linux
on:
  push:
    paths: ['steam_saves.py', 'test_steam_saves.py', '.github/workflows/tests.yml']
  pull_request:
    paths: ['steam_saves.py', 'test_steam_saves.py', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -X utf8 -m unittest -v
      - run: python -X utf8 steam_saves.py --help
